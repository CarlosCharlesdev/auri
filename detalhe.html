<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detalhe da Denúncia</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
<script src="/layout.js"></script>
<script>
function renderMidia(fotoUrl) {
  if (!fotoUrl) return '';

  let preview = null, mediaId = null, mimeType = '';

  try {
    const parsed = JSON.parse(fotoUrl);
    preview  = parsed.preview  || null;
    mediaId  = parsed.id       || null;
    mimeType = parsed.mime_type || '';
  } catch(e) {
    if (fotoUrl.startsWith('data:')) preview = fotoUrl;
    else mediaId = fotoUrl;
  }

  const isVideo = mimeType.startsWith('video') ||
    (mediaId && (mediaId.startsWith('mp4') || mediaId.startsWith('video')));

  // Sempre usa o proxy com o ID original pra qualidade máxima
  // Preview só como fallback se não tiver ID
  let src = null;
  if (mediaId) {
    src = `/api/foto/${encodeURIComponent(mediaId)}`;
  } else if (preview) {
    src = preview; // fallback: miniatura base64
  }

  if (!src) return '';

  const label = isVideo ? 'Vídeo enviado' : 'Foto enviada';

  if (isVideo) {
    return `
      <div class="card">
        <div class="info-label" style="margin-bottom:8px">${label}</div>
        <video controls style="width:100%;max-height:500px;border-radius:8px;background:#000;border:1px solid var(--border)">
          <source src="${src}" type="${mimeType}">
          Seu navegador não suporta vídeo.
          <a href="${src}" target="_blank">Abrir diretamente</a>
        </video>
      </div>`;
  }

  return `
    <div class="card">
      <div class="info-label" style="margin-bottom:8px">${label}</div>
      <img src="${src}"
           alt="Foto da denúncia"
           id="foto-img"
           style="width:100%;max-height:500px;object-fit:contain;background:var(--surface2);border-radius:8px;display:block"
           onerror="
             const img = document.getElementById('foto-img');
             const err = document.getElementById('foto-err');
             const prev = '${preview || ''}';
             if (prev && img.src !== prev) {
               img.src = prev;
             } else {
               img.style.display='none';
               err.style.display='flex';
             }
           ">
      <div id="foto-err" style="display:none;align-items:center;justify-content:center;padding:24px;color:var(--text-dim);font-size:13px;gap:6px">
        📷 Foto não disponível
        ${mediaId ? `— <a href="/api/foto/${encodeURIComponent(mediaId)}" target="_blank" style="color:var(--orange)">abrir diretamente</a>` : ''}
      </div>
    </div>`;
}

async function init() {
  await renderLayout('Detalhe', 'Informações da denúncia', 'denuncias');

  const id = location.pathname.split('/').pop();
  const c  = document.getElementById('content');

  c.innerHTML = '<div class="loading"><div class="spinner"></div> Carregando...</div>';

  const d = await fetch(`/api/denuncia/${id}`).then(r => r.json());

  if (d.erro) {
    c.innerHTML = `<div class="empty"><div class="icon">❌</div><p>${d.erro}</p></div>`;
    return;
  }

  c.innerHTML = `
    <a href="/denuncias" class="back-btn">← Voltar para lista</a>

    <div class="detalhe-grid">
      <div>
        <div class="card" style="margin-bottom:16px">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px">
            <div>
              <div class="card-label">Protocolo</div>
              <div class="protocolo" style="font-size:20px;margin-top:4px">${d.protocolo}</div>
            </div>
            <div>${badgeHTML(d.status)}</div>
          </div>

          <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
            <div class="info-block">
              <div class="info-label">Módulo</div>
              <div class="info-value" style="font-weight:600">${d.modulo || '—'}</div>
            </div>
            <div class="info-block">
              <div class="info-label">Tipo / Subcategoria</div>
              <div class="info-value">${d.subcategoria || '—'}</div>
            </div>
            <div class="info-block" style="grid-column:1/-1">
              <div class="info-label">Descrição</div>
              <div class="info-value">${d.descricao || '—'}</div>
            </div>
            <div class="info-block">
              <div class="info-label">Local</div>
              <div class="info-value">${d.local || '—'}</div>
            </div>
            <div class="info-block">
              <div class="info-label">Data da ocorrência</div>
              <div class="info-value">${d.data_ocorrencia || '—'}</div>
            </div>
            <div class="info-block">
              <div class="info-label">Registrado em</div>
              <div class="info-value">${formatDate(d.criado_em)}</div>
            </div>
            <div class="info-block">
              <div class="info-label">WhatsApp</div>
              <div class="info-value">${d.anonimo ? '🔒 Anônimo' : (d.numero_whatsapp || '—')}</div>
            </div>
          </div>
        </div>

        ${renderMidia(d.foto_url)}
      </div>

      <div>
        <div class="card">
          <div class="status-select-wrap">
            <label>Alterar status</label>
            <select id="novo-status">
              <option value="pendente"   ${d.status === 'pendente'   ? 'selected' : ''}>🟡 Pendente</option>
              <option value="em_analise" ${d.status === 'em_analise' ? 'selected' : ''}>🔵 Em análise</option>
              <option value="resolvido"  ${d.status === 'resolvido'  ? 'selected' : ''}>🟢 Resolvido</option>
              <option value="arquivado"  ${d.status === 'arquivado'  ? 'selected' : ''}>⚫ Arquivado</option>
            </select>
            <button class="btn btn-primary" onclick="salvarStatus(${d.id})">Salvar status</button>
          </div>
        </div>

        <div class="card" style="margin-top:12px">
          <div class="info-label" style="margin-bottom:12px">Resumo</div>
          <div style="display:flex;flex-direction:column;gap:8px;font-size:13px">
            <div style="display:flex;justify-content:space-between">
              <span style="color:var(--text-dim)">ID</span>
              <span style="font-family:'JetBrains Mono',monospace">#${d.id}</span>
            </div>
            <div style="display:flex;justify-content:space-between">
              <span style="color:var(--text-dim)">Mídia</span>
              <span>${d.foto_url ? '✅ Sim' : '❌ Não'}</span>
            </div>
            <div style="display:flex;justify-content:space-between">
              <span style="color:var(--text-dim)">Anônimo</span>
              <span>${d.anonimo ? '✅ Sim' : '❌ Não'}</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  `;
}

async function salvarStatus(id) {
  const status = document.getElementById('novo-status').value;
  const res = await fetch(`/api/denuncia/${id}/status`, {
    method: 'PATCH',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ status })
  }).then(r => r.json());

  if (res.ok) toast('Status atualizado com sucesso!', 'success');
  else toast('Erro ao atualizar status.', 'error');
}

init();
</script>
</body>
</html>
